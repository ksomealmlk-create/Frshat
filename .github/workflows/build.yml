name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.qasim --project-name white_epic .
      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="الملحمة البيضاء"/' android/app/src/main/AndroidManifest.xml
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: white-epic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
